apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-app
  name: my-app-app
  namespace: default
spec:
  selector:
    matchLabels:
      app: my-app
  strategy: {}
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - image: my-app:1.9.0
        name: server
        ports:
        - containerPort: 8080
          name: http
        resources: {}
