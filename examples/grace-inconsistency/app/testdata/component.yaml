apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-app
  name: my-app-monitoring
  namespace: default
spec:
  selector:
    matchLabels:
      app: my-app
      role: monitoring
  strategy: {}
  template:
    metadata:
      labels:
        app: my-app
        role: monitoring
    spec:
      containers:
      - image: prom/node-exporter:v1.3.1
        name: prometheus-exporter
        resources: {}
