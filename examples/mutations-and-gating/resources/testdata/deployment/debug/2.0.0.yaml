apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-app
  name: my-app-app
  namespace: default
spec:
  selector:
    matchLabels:
      app: my-app
  strategy: {}
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - env:
        - name: LOG_LEVEL
          value: debug
        image: my-app:2.0.0
        name: app
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: health
        resources: {}
