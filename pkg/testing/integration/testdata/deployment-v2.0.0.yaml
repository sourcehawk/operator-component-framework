apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-app
    app.kubernetes.io/managed-by: my-operator
    app.kubernetes.io/version: 2.0.0
  name: my-app-web
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  strategy: {}
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - image: my-app:2.0.0
        name: app
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: health
        resources: {}
