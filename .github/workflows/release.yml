name: Release

on:
  release:
    types: [created, published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plugin-version-${{ github.event.release.tag_name }}

jobs:
  plugin-version:
    name: Plugin version matches the release
    # A release created as published fires both events; check it once, on publish.
    if: github.event.action == 'published' || github.event.release.draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      MANIFEST: plugin/.claude-plugin/plugin.json
    steps:
      - name: Clone the release commit
        uses: actions/checkout@v7
        with:
          # A draft has no tag yet, so check the commit it will be tagged on.
          ref: ${{ github.event.release.draft && github.event.release.target_commitish || github.event.release.tag_name }}

      - name: Compare the plugin version with the tag
        id: compare
        run: |
          want="${TAG#v}"
          have="$(jq -r .version "$MANIFEST")"
          echo "want=$want" >> "$GITHUB_OUTPUT"
          echo "have=$have" >> "$GITHUB_OUTPUT"
          if [ "$have" = "$want" ]; then
            echo "The plugin version $have matches $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a pull request that sets the plugin version
        if: steps.compare.outputs.have != steps.compare.outputs.want
        env:
          WANT: ${{ steps.compare.outputs.want }}
          HAVE: ${{ steps.compare.outputs.have }}
          DRAFT: ${{ github.event.release.draft }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          repo="$GITHUB_REPOSITORY"
          branch="chore/plugin-version-$WANT"
          title="chore(plugin): set the plugin version to $WANT"

          link=""
          main_version="$(gh api "repos/$repo/contents/$MANIFEST?ref=$DEFAULT_BRANCH" --jq .content | base64 -d | jq -r .version)"
          if [ "$main_version" != "$WANT" ]; then
            if ! gh api "repos/$repo/git/ref/heads/$branch" > /dev/null 2>&1; then
              base_sha="$(gh api "repos/$repo/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
              gh api "repos/$repo/git/refs" -f ref="refs/heads/$branch" -f sha="$base_sha" > /dev/null
              file="$(gh api "repos/$repo/contents/$MANIFEST?ref=$branch")"
              content="$(jq -r .content <<< "$file" | base64 -d | sed -E 's/("version": *")[^"]*"/\1'"$WANT"'"/')"
              # The contents API makes a commit that GitHub signs. The ruleset on the
              # default branch rejects unsigned commits, which a git push from here makes.
              gh api -X PUT "repos/$repo/contents/$MANIFEST" \
                -f message="$title" \
                -f branch="$branch" \
                -f sha="$(jq -r .sha <<< "$file")" \
                -f content="$(base64 -w0 <<< "$content")" > /dev/null
            fi

            link="$(gh pr list --repo "$repo" --head "$branch" --state open --json url --jq '.[0].url // empty')"
            if [ -z "$link" ]; then
              body="Claude Code caches a plugin by the \`version\` in its \`plugin.json\`. Release $TAG has plugin version \`$HAVE\`, so installed plugins do not update. This PR sets the version to \`$WANT\`."
              # Creating the pull request fails when the repository does not let
              # GitHub Actions create pull requests. The compare page opens one in a click.
              if ! link="$(gh pr create --repo "$repo" --base "$DEFAULT_BRANCH" --head "$branch" --title "$title" --body "$body")"; then
                link="https://github.com/$repo/compare/$DEFAULT_BRANCH...$branch?expand=1"
              fi
            fi
          fi

          if [ "$DRAFT" = "true" ] && [ -n "$link" ]; then
            fix="Merge $link, then publish the draft from a commit that includes the change."
          elif [ "$DRAFT" = "true" ]; then
            fix="$DEFAULT_BRANCH already sets $WANT. Point the draft at a commit that includes it, then publish it."
          elif [ -n "$link" ]; then
            fix="$TAG points at a commit with plugin version $HAVE. Merge $link, then publish a patch release so installed plugins update."
          else
            fix="$TAG points at a commit with plugin version $HAVE. $DEFAULT_BRANCH already sets $WANT, so publish a patch release from it."
          fi

          {
            echo "### Plugin version does not match $TAG"
            echo
            echo "\`$MANIFEST\` sets \`$HAVE\`, and the release needs \`$WANT\`. Claude Code caches a plugin by this version, so installed plugins do not get the release."
            echo
            echo "$fix"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error file=$MANIFEST::Plugin version $HAVE does not match $TAG. $fix"
          exit 1
