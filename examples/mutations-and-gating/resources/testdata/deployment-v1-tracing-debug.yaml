apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-app
  name: my-app-app
  namespace: default
spec:
  selector:
    matchLabels:
      app: my-app
  strategy: {}
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - env:
        - name: LOG_LEVEL
          value: debug
        - name: JAEGER_AGENT_HOST
          value: localhost
        image: my-app:1.9.0
        name: server
        ports:
        - containerPort: 8080
          name: http
        resources: {}
      - env:
        - name: JAEGER_AGENT_HOST
          value: localhost
        image: jaegertracing/jaeger-agent:1.28
        name: jaeger-agent
        resources: {}
